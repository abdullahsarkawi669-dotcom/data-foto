<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.5">
  <title>Database Foto Santri - Offline</title>
  
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>

  <style>
    :root {
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --secondary: #f1f5f9;
      --text-dark: #0f172a;
      --text-muted: #64748b;
      --border-color: #e2e8f0;
      --danger: #ef4444;
      --success: #10b981;
      --font-family: 'Plus Jakarta Sans', sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    body {
      font-family: var(--font-family);
      background: linear-gradient(135deg, #f0f4f8 0%, #e2e8f0 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      color: var(--text-dark);
    }

    .app-container {
      max-width: 600px;
      width: 100%;
      background: rgba(255, 255, 255, 0.95);
      border-radius: 24px;
      padding: 32px 28px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.08);
      position: relative;
    }

    .header-title { text-align: center; margin-bottom: 24px; }
    .header-title h1 { font-size: 22px; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 10px; margin-bottom: 6px; }
    .header-title h1 i { color: var(--primary); background: #eff6ff; padding: 12px; border-radius: 14px; font-size: 20px; }
    .header-title p { font-size: 14px; color: var(--text-muted); font-weight: 500; }
    
    .status-area { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; margin-top: 12px; }
    .status-badge { padding: 6px 14px; border-radius: 20px; font-size: 12px; font-weight: 700; display: inline-flex; align-items: center; gap: 6px; }
    .mode-badge { background: #dcfce7; color: #166534; }
    .folder-btn { background: #fef3c7; color: #b45309; cursor: pointer; transition: 0.2s; }
    .folder-btn:hover { background: #fde68a; }
    .backup-btn { background: #e0e7ff; color: #4338ca; cursor: pointer; transition: 0.2s; }
    .backup-btn:hover { background: #c7d2fe; }

    .card-box {
      background: #ffffff;
      padding: 24px;
      border-radius: 20px;
      border: 1px solid var(--border-color);
      display: flex; flex-direction: column; gap: 20px;
    }

    .input-group { display: flex; flex-direction: column; gap: 8px; position: relative; }
    .input-group label { font-size: 14px; font-weight: 600; display: flex; align-items: center; gap: 8px; }
    
    .input-wrapper { position: relative; }
    .input-wrapper input, .input-wrapper select {
      width: 100%; padding: 14px 16px 14px 44px; border-radius: 14px; border: 2px solid var(--border-color);
      font-size: 14px; font-family: inherit; background: var(--secondary); outline: none; font-weight: 500;
      color: var(--text-dark); transition: all 0.3s ease;
    }
    .input-wrapper select { appearance: none; cursor: pointer; }
    .input-wrapper input:focus, .input-wrapper select:focus { border-color: var(--primary); background: #ffffff; box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.1); }
    .input-wrapper .search-icon { position: absolute; left: 16px; top: 50%; transform: translateY(-50%); color: var(--text-muted); font-size: 16px; pointer-events: none; }
    .select-arrow { position: absolute; right: 16px; top: 50%; transform: translateY(-50%); color: var(--text-muted); pointer-events: none; }

    .suggestion-list {
      background: #ffffff; border-radius: 14px; box-shadow: 0 10px 25px -5px rgba(0,0,0,0.15);
      max-height: 250px; overflow-y: auto; position: absolute; width: 100%; top: 100%; z-index: 20;
      margin-top: 8px; border: 1px solid var(--border-color); display: none;
    }
    
    .suggestion-item {
      padding: 12px 16px; cursor: pointer; display: flex; align-items: center; gap: 12px;
      border-bottom: 1px solid var(--secondary); transition: background 0.2s ease;
    }
    .suggestion-item:hover { background: #eff6ff; }
    
    .thumb-preview { width: 40px; height: 40px; border-radius: 50%; object-fit: cover; background: #e2e8f0; border: 2px solid var(--primary); }
    .thumb-placeholder {
      width: 40px; height: 40px; border-radius: 50%; background: #f1f5f9; display: flex; align-items: center; 
      justify-content: center; color: #94a8c3; font-size: 16px; border: 2px dashed #cbd5e1;
    }
    .suggestion-text { font-size: 14px; font-weight: 600; color: var(--text-dark); display: flex; flex-direction: column; }
    .status-text { font-size: 11px; color: var(--success); font-weight: 700; margin-top: 2px; }

    hr { border: 0; border-top: 1px dashed #cbd5e1; margin: 4px 0; }

    .camera-section { display: flex; flex-direction: column; gap: 12px; }
    .camera-container {
      width: 100%; border-radius: 16px; overflow: hidden; background: #000; position: relative;
      border: 2px solid var(--border-color); aspect-ratio: 4/3; display: flex; justify-content: center; align-items: center;
    }
    video, #imagePreview { width: 100%; height: 100%; object-fit: cover; display: block; }

    .btn {
      width: 100%; padding: 14px 20px; border-radius: 14px; font-weight: 600; font-size: 15px; font-family: inherit;
      cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 10px; transition: all 0.2s ease; border: none;
    }
    .btn:active { transform: scale(0.98); }
    .btn-primary { background: var(--primary); color: white; }
    .btn-secondary { background: var(--secondary); color: var(--text-dark); border: 1px solid #cbd5e1; }
    .btn-danger { background: #fff; color: var(--danger); border: 1px solid var(--danger); }
    .btn-success { background: var(--success); color: white; }
    .action-buttons { display: flex; gap: 10px; margin-top: 10px; }

    @media (max-width: 768px) {
      .camera-section {
        position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
        z-index: 9999; background: #000; margin: 0; padding: 0; border-radius: 0;
        display: flex; flex-direction: column; justify-content: center;
      }
      .camera-section > label {
        position: absolute; top: 20px; left: 20px; color: white; z-index: 10002;
        text-shadow: 0 2px 4px rgba(0,0,0,0.8); font-size: 16px;
      }
      .camera-container {
        flex: 1; height: 100%; width: 100%; border: none; border-radius: 0; aspect-ratio: auto;
      }
      video, #imagePreview { width: 100%; height: 100%; object-fit: cover; }
      
      .action-buttons {
        position: absolute; bottom: 30px; left: 20px; right: 20px;
        z-index: 10001; margin-top: 0;
      }
      .btn { padding: 16px 20px; font-size: 16px; box-shadow: 0 4px 15px rgba(0,0,0,0.3); }
    }

    .modal-overlay {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(15, 23, 42, 0.75);
      backdrop-filter: blur(4px); z-index: 100; display: none; justify-content: center; align-items: center; padding: 20px;
    }
    .modal-content {
      background: white; width: 100%; max-width: 800px; max-height: 90vh; border-radius: 24px;
      display: flex; flex-direction: column; overflow: hidden; box-shadow: 0 25px 50px -12px rgba(0,0,0,0.25);
    }
    .modal-header { padding: 20px 24px; border-bottom: 1px solid var(--border-color); display: flex; justify-content: space-between; align-items: center; }
    .modal-header h2 { font-size: 18px; display: flex; align-items: center; gap: 10px; }
    .close-modal { background: none; border: none; font-size: 20px; color: var(--text-muted); cursor: pointer; }
    .modal-body { padding: 20px 24px; overflow-y: auto; flex: 1; display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 16px; }
    
    .gallery-item { position: relative; display: flex; flex-direction: column; gap: 8px; align-items: center; text-align: center; }
    .gallery-item img { width: 100%; aspect-ratio: 3/4; object-fit: cover; border-radius: 12px; border: 1px solid var(--border-color); }
    .gallery-item span { font-size: 11px; font-weight: 600; line-height: 1.3; word-break: break-word; }

    /* Tombol Hapus Foto di Riwayat */
    .delete-photo-btn {
      position: absolute; top: 6px; right: 6px; background: rgba(239, 68, 68, 0.9);
      color: white; border: none; border-radius: 50%; width: 28px; height: 28px;
      font-size: 12px; cursor: pointer; display: flex; justify-content: center; align-items: center;
      transition: all 0.2s ease; box-shadow: 0 2px 5px rgba(0,0,0,0.2);
    }
    .delete-photo-btn:hover { background: #dc2626; transform: scale(1.1); }
    
    /* Tombol Ganti Foto di Riwayat */
    .edit-photo-btn {
      position: absolute; top: 6px; left: 6px; background: rgba(37, 99, 235, 0.9);
      color: white; border: none; border-radius: 50%; width: 28px; height: 28px;
      font-size: 12px; cursor: pointer; display: flex; justify-content: center; align-items: center;
      transition: all 0.2s ease; box-shadow: 0 2px 5px rgba(0,0,0,0.2);
    }
    .edit-photo-btn:hover { background: #1d4ed8; transform: scale(1.1); }

    #zipLoadingOverlay {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(255,255,255,0.9);
      z-index: 99999; display: none; flex-direction: column; justify-content: center; align-items: center; gap: 15px;
    }
    .spinner {
      width: 40px; height: 40px; border: 4px solid rgba(37, 99, 235, 0.2);
      border-top-color: var(--primary); border-radius: 50%; animation: spin 1s linear infinite;
    }
    @keyframes spin { 100% { transform: rotate(360deg); } }
  </style>
</head>
<body>

<div id="zipLoadingOverlay">
  <div class="spinner"></div>
  <h3 style="color: var(--text-dark);">Sedang mengemas foto ke dalam ZIP...</h3>
  <p style="color: var(--text-muted); font-size: 14px;">Mohon tunggu sebentar, jangan tutup browser.</p>
</div>

<div class="app-container">
  <div class="header-title">
    <h1><i class="fas fa-database"></i> Database Foto Lokal</h1>
    <p>SMP IT Putra Abu Hurairah Mataram</p>
    <div class="status-area">
      <div class="status-badge mode-badge"><i class="fas fa-hdd"></i> Offline</div>
      <div class="status-badge folder-btn" id="openFolderBtn"><i class="fas fa-history"></i> Riwayat</div>
      <div class="status-badge backup-btn" id="backupZipBtn"><i class="fas fa-file-archive"></i> Backup (.ZIP)</div>
    </div>
  </div>

  <div class="card-box">
    <!-- Filter Kelas -->
    <div class="input-group">
      <label for="classFilter"><i class="fas fa-users"></i> Pilih Kelas</label>
      <div class="input-wrapper">
        <i class="fas fa-filter search-icon"></i>
        <select id="classFilter">
          <option value="">-- Semua Kelas --</option>
        </select>
        <i class="fas fa-chevron-down select-arrow"></i>
      </div>
    </div>

    <!-- Pencarian Nama Santri -->
    <div class="input-group">
      <label for="searchSantriInput"><i class="fas fa-search"></i> Cari Nama Santri</label>
      <div class="input-wrapper">
        <i class="fas fa-user-graduate search-icon"></i>
        <input type="text" id="searchSantriInput" placeholder="Ketik nama santri..." autocomplete="off">
      </div>
      <div id="suggestionBox" class="suggestion-list"></div>
    </div>

    <hr>
  </div>
</div>

<div id="cameraArea" class="camera-section" style="display: none;">
  <label><i class="fas fa-video"></i> Kamera Utama</label>
  <div class="camera-container">
    <video id="videoElement" autoplay playsinline></video>
  </div>
  <div class="action-buttons">
    <button class="btn btn-danger" id="cancelCameraBtn" style="flex: 1;"><i class="fas fa-times"></i> Batal</button>
    <button class="btn btn-secondary" id="captureBtn" style="flex: 2;"><i class="fas fa-camera"></i> Jepret Foto</button>
  </div>
</div>

<div id="previewArea" class="camera-section" style="display: none;">
  <label><i class="fas fa-image"></i> Pratinjau Foto</label>
  <div class="camera-container">
    <img id="imagePreview" src="" alt="Hasil Foto">
  </div>
  <div class="action-buttons" style="flex-wrap: wrap;">
    <button class="btn btn-danger" id="cancelPreviewBtn" style="flex: 1; min-width: 100px;"><i class="fas fa-times"></i> Batal</button>
    <button class="btn btn-secondary" id="retakeBtn" style="flex: 1; min-width: 120px;"><i class="fas fa-redo-alt"></i> Ganti Foto</button>
    
    <button class="btn btn-primary" id="saveAndDownloadBtn" style="flex: 2; display: none; min-width: 200px;">
      <i class="fas fa-save"></i> Simpan & Unduh Foto
    </button>
    <button class="btn btn-success" id="downloadBtn" style="flex: 2; display: none; min-width: 200px;">
      <i class="fas fa-download"></i> Unduh Ulang
    </button>
  </div>
</div>

<canvas id="canvasElement" style="display: none;"></canvas>

<div class="modal-overlay" id="galleryModal">
  <div class="modal-content">
    <div class="modal-header">
      <h2><i class="fas fa-history" style="color: #b45309;"></i> Riwayat Foto Tersimpan</h2>
      <button class="close-modal" id="closeFolderBtn"><i class="fas fa-times"></i></button>
    </div>
    <div class="modal-body" id="galleryGrid"></div>
  </div>
</div>

  const SANTRI_LIST = [];
  for (const kelas in DATA_SANTRI) {
    DATA_SANTRI[kelas].forEach(nama => SANTRI_LIST.push(`${nama} (${kelas})`));
  }

  // --- IndexedDB Setup ---
  const dbName = 'SantriDatabase';
  const storeName = 'photos';
  let db;
  let savedPhotosCache = {};

  function initDB() {
    const request = indexedDB.open(dbName, 1);
    request.onerror = (e) => console.error("Database error:", e.target.errorCode);
    request.onsuccess = (e) => {
      db = e.target.result;
      loadCacheFromDB();
    };
    request.onupgradeneeded = (e) => {
      db = e.target.result;
      if (!db.objectStoreNames.contains(storeName)) {
        db.createObjectStore(storeName, { keyPath: 'id' });
      }
    };
  }

  function loadCacheFromDB() {
    const transaction = db.transaction([storeName], 'readonly');
    const store = transaction.objectStore(storeName);
    const request = store.getAll();
    request.onsuccess = () => {
      request.result.forEach(record => {
        savedPhotosCache[record.id] = record.photoData;
      });
    };
  }

  initDB();

  // --- DOM Elements ---
  const classFilter = document.getElementById('classFilter');
  const searchInput = document.getElementById('searchSantriInput');
  const suggestionBox = document.getElementById('suggestionBox');
  const videoElement = document.getElementById('videoElement');
  const canvasElement = document.getElementById('canvasElement');
  
  const captureBtn = document.getElementById('captureBtn');
  const cancelCameraBtn = document.getElementById('cancelCameraBtn'); 
  const cancelPreviewBtn = document.getElementById('cancelPreviewBtn');
  const retakeBtn = document.getElementById('retakeBtn');
  const downloadBtn = document.getElementById('downloadBtn');
  const saveAndDownloadBtn = document.getElementById('saveAndDownloadBtn');
  
  const cameraArea = document.getElementById('cameraArea');
  const previewArea = document.getElementById('previewArea');
  const imagePreview = document.getElementById('imagePreview');

  const openFolderBtn = document.getElementById('openFolderBtn');
  const closeFolderBtn = document.getElementById('closeFolderBtn');
  const galleryModal = document.getElementById('galleryModal');
  const galleryGrid = document.getElementById('galleryGrid');
  
  const backupZipBtn = document.getElementById('backupZipBtn');
  const zipLoadingOverlay = document.getElementById('zipLoadingOverlay');

  let currentPhotoData = '';
  let selectedNameRaw = '';
  let streamRef = null;

  function populateClassDropdown() {
    for (const kelas in DATA_SANTRI) {
      const option = document.createElement('option');
      option.value = kelas;
      option.textContent = `Kelas ${kelas}`;
      classFilter.appendChild(option);
    }
  }
  populateClassDropdown();

  async function startCamera() {
    if (streamRef) return;
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ 
        video: { facingMode: 'environment', width: { ideal: 1920 }, height: { ideal: 1080 } } 
      });
      videoElement.srcObject = stream;
      streamRef = stream;
    } catch (err) {
      alert("Akses kamera gagal. Pastikan browser memiliki izin kamera.");
    }
  }

  function stopCamera() {
    if (streamRef) {
      streamRef.getTracks().forEach(track => track.stop());
      videoElement.srcObject = null;
      streamRef = null;
    }
  }

  function resetToInitialState() {
    stopCamera();
    cameraArea.style.display = 'none';
    previewArea.style.display = 'none';
    searchInput.value = '';
    selectedNameRaw = '';
    currentPhotoData = '';
  }

  function showSuggestions(query) {
    const selectedClass = classFilter.value;
    let filtered = SANTRI_LIST;
    
    if (selectedClass) filtered = filtered.filter(s => s.endsWith(`(${selectedClass})`));
    if (!query.trim() && !selectedClass) { suggestionBox.style.display = 'none'; return; }
    if (query.trim()) filtered = filtered.filter(s => s.toLowerCase().includes(query.toLowerCase()));
    
    suggestionBox.innerHTML = '';
    if (filtered.length === 0) { suggestionBox.style.display = 'none'; return; }
    
    filtered.forEach(item => {
      const div = document.createElement('div');
      div.className = 'suggestion-item';
      
      const hasPhoto = savedPhotosCache[item];
      const regex = new RegExp(`(${query})`, "gi");
      const highlightedText = query.trim() ? item.replace(regex, "<strong>$1</strong>") : item;

      div.innerHTML = `
        ${hasPhoto ? `<img src="${hasPhoto}" class="thumb-preview">` : `<div class="thumb-placeholder"><i class="fas fa-user"></i></div>`}
        <div class="suggestion-text">
          <span>${highlightedText}</span>
          ${hasPhoto ? `<span class="status-text"><i class="fas fa-check-circle"></i> Foto Tersedia</span>` : ''}
        </div>
      `;
      
      div.addEventListener('click', () => {
        searchInput.value = item;
        selectedNameRaw = item;
        suggestionBox.style.display = 'none';

        if (hasPhoto) {
          currentPhotoData = hasPhoto;
          imagePreview.src = hasPhoto;
          stopCamera();
          cameraArea.style.display = 'none';
          previewArea.style.display = 'flex';
          
          saveAndDownloadBtn.style.display = 'none';
          downloadBtn.style.display = 'flex';
        } else {
          currentPhotoData = '';
          previewArea.style.display = 'none';
          cameraArea.style.display = 'flex';
          startCamera();
        }
      });
      suggestionBox.appendChild(div);
    });
    suggestionBox.style.display = 'block';
  }

  searchInput.addEventListener('input', (e) => showSuggestions(e.target.value));
  searchInput.addEventListener('focus', (e) => showSuggestions(e.target.value));
  classFilter.addEventListener('change', () => { searchInput.value = ''; showSuggestions(''); });

  document.addEventListener('click', function(event) {
    if (!searchInput.contains(event.target) && !suggestionBox.contains(event.target) && !classFilter.contains(event.target)) {
      suggestionBox.style.display = 'none';
    }
  });

  cancelCameraBtn.addEventListener('click', resetToInitialState);
  cancelPreviewBtn.addEventListener('click', resetToInitialState);

  captureBtn.addEventListener('click', () => {
    const MAX_DIMENSION = 1600;
    let width = videoElement.videoWidth;
    let height = videoElement.videoHeight;

    if (width > MAX_DIMENSION || height > MAX_DIMENSION) {
      if (width > height) {
        height = Math.round((height * MAX_DIMENSION) / width);
        width = MAX_DIMENSION;
      } else {
        width = Math.round((width * MAX_DIMENSION) / height);
        height = MAX_DIMENSION;
      }
    }

    canvasElement.width = width;
    canvasElement.height = height;
    const context = canvasElement.getContext('2d');
    context.drawImage(videoElement, 0, 0, width, height);
    
    const dataUrl = canvasElement.toDataURL('image/jpeg', 0.85); 
    imagePreview.src = dataUrl;
    currentPhotoData = dataUrl;
    
    stopCamera(); 
    cameraArea.style.display = 'none';
    previewArea.style.display = 'flex';
    downloadBtn.style.display = 'none';
    saveAndDownloadBtn.style.display = 'flex';
  });

  retakeBtn.addEventListener('click', () => {
    currentPhotoData = '';
    previewArea.style.display = 'none';
    cameraArea.style.display = 'flex';
    startCamera(); 
  });

  function triggerDownload(dataUrl, rawNameStr) {
    const match = rawNameStr.match(/^(.*?)\s*\(([^)]+)\)$/);
    const namaBersih = match ? match[1].trim() : rawNameStr;
    const kelas = match ? match[2].trim() : '';
    const filename = `${kelas}-${namaBersih}.jpg`;

    const a = document.createElement('a');
    a.href = dataUrl;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
  }

  saveAndDownloadBtn.addEventListener('click', () => {
    const rawName = searchInput.value.trim();
    if (!rawName || !currentPhotoData) return;

    const transaction = db.transaction([storeName], 'readwrite');
    const store = transaction.objectStore(storeName);
    const dataObj = { id: rawName, photoData: currentPhotoData, timestamp: new Date().toISOString() };
    const request = store.put(dataObj);
    
    request.onsuccess = () => {
      savedPhotosCache[rawName] = currentPhotoData;
      triggerDownload(currentPhotoData, rawName);
      alert('✅ Foto tersimpan dan berhasil diunduh!');
      resetToInitialState();
    };
  });

  downloadBtn.addEventListener('click', () => {
    if (!selectedNameRaw || !currentPhotoData) return;
    triggerDownload(currentPhotoData, selectedNameRaw);
  });

  // --- MODAL RIWAYAT DAN FUNGSI RENDER GALLERY ---
  function renderGallery() {
    galleryGrid.innerHTML = '';
    const keys = Object.keys(savedPhotosCache);
    
    if (keys.length === 0) {
      galleryGrid.innerHTML = '<p style="grid-column: 1/-1; text-align: center; color: #64748b;">Belum ada foto yang tersimpan.</p>';
    } else {
      keys.forEach(key => {
        const div = document.createElement('div');
        div.className = 'gallery-item';
        
        // Tombol Ganti Foto (Kiri)
        const editBtn = document.createElement('button');
        editBtn.className = 'edit-photo-btn';
        editBtn.innerHTML = '<i class="fas fa-camera"></i>';
        editBtn.title = `Ganti foto ${key}`;
        
        editBtn.addEventListener('click', () => {
          galleryModal.style.display = 'none'; // Tutup riwayat
          
          searchInput.value = key;
          selectedNameRaw = key;
          
          currentPhotoData = '';
          previewArea.style.display = 'none';
          downloadBtn.style.display = 'none';
          saveAndDownloadBtn.style.display = 'none';
          
          cameraArea.style.display = 'flex';
          startCamera();
        });

        // Tombol Hapus (Kanan)
        const delBtn = document.createElement('button');
        delBtn.className = 'delete-photo-btn';
        delBtn.innerHTML = '<i class="fas fa-trash"></i>';
        delBtn.title = `Hapus foto ${key}`;
        
        delBtn.addEventListener('click', () => {
          if (confirm(`Yakin ingin menghapus foto ${key}?`)) {
            const transaction = db.transaction([storeName], 'readwrite');
            const store = transaction.objectStore(storeName);
            store.delete(key).onsuccess = () => {
              delete savedPhotosCache[key];
              div.remove();
              if (Object.keys(savedPhotosCache).length === 0) {
                galleryGrid.innerHTML = '<p style="grid-column: 1/-1; text-align: center; color: #64748b;">Belum ada foto yang tersimpan.</p>';
              }
            };
          }
        });

        const img = document.createElement('img');
        img.src = savedPhotosCache[key];
        img.alt = key;

        const span = document.createElement('span');
        span.textContent = key;
        
        div.appendChild(editBtn);
        div.appendChild(delBtn);
        div.appendChild(img);
        div.appendChild(span);
        
        galleryGrid.appendChild(div);
      });
    }
  }

  openFolderBtn.addEventListener('click', () => {
    renderGallery();
    galleryModal.style.display = 'flex';
  });
  
  closeFolderBtn.addEventListener('click', () => galleryModal.style.display = 'none');

  backupZipBtn.addEventListener('click', () => {
    const transaction = db.transaction([storeName], 'readonly');
    const store = transaction.objectStore(storeName);
    const request = store.getAll();

    request.onsuccess = async () => {
      const records = request.result;
      if (records.length === 0) { alert('Database kosong. Belum ada foto yang bisa di-backup.'); return; }
      zipLoadingOverlay.style.display = 'flex';
      try {
        const zip = new JSZip();
        const folder = zip.folder("Backup_Foto_Santri");
        records.forEach(record => {
          const match = record.id.match(/^(.*?)\s*\(([^)]+)\)$/);
          const nama = match ? match[1].trim() : record.id;
          const kelas = match ? match[2].trim() : 'Unknown';
          const filename = `${kelas}-${nama.replace(/\s+/g, '_')}.jpg`;
          const base64Data = record.photoData.split(',')[1];
          folder.file(filename, base64Data, {base64: true});
        });
        const content = await zip.generateAsync({type: "blob"});
        const dateStr = new Date().toISOString().slice(0, 10).replace(/-/g, '');
        const a = document.createElement("a");
        a.href = URL.createObjectURL(content);
        a.download = `Backup_Foto_Santri_${dateStr}.zip`;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(a.href);
        alert(`✅ Berhasil! File ZIP berisi ${records.length} foto telah diunduh.`);
      } catch (error) {
        alert('❌ Terjadi kesalahan saat membuat ZIP: ' + error.message);
      } finally {
        zipLoadingOverlay.style.display = 'none';
      }
    };
  });
</script>
